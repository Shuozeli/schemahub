syntax = "proto3";
package schemahub.v1;

option go_package = "github.com/shuozeli/schemahub/gen/go/schemahub/v1";

import "schemahub/v1/enums.proto";
import "schemahub/v1/refs.proto";
import "schemahub/v1/resources.proto";

service ExplorationService {
  // List all schema files in a repo at a given ref.
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);

  // List all top-level declarations in a schema file.
  rpc ListDeclarations(ListDeclarationsRequest) returns (ListDeclarationsResponse);

  // Return full detail for one named declaration.
  rpc GetDeclaration(GetDeclarationRequest) returns (GetDeclarationResponse);

  // Return the raw source text of a schema file as originally uploaded.
  rpc GetSchemaSource(GetSchemaSourceRequest) returns (GetSchemaSourceResponse);

  // Follow a field's type reference, potentially crossing import boundaries.
  rpc FollowType(FollowTypeRequest) returns (FollowTypeResponse);

  // List normalized direct or transitive imports. Pinned edges retain their
  // stored commit; live edges resolve to one immutable repository snapshot for
  // this call. Unavailable external/builtin targets remain explicit edges.
  rpc ListDependencies(ListDependenciesRequest) returns (ListDependenciesResponse);

  // Find direct imports to one schema across every repository visible to the
  // caller. Each repository is read at one immutable default-bookmark snapshot.
  rpc ListDependents(ListDependentsRequest) returns (ListDependentsResponse);

  // Search for declarations by name across schemas in one repository.
  rpc Search(SearchRequest) returns (SearchResponse);
}

// ── ListSchemas ───────────────────────────────────────────────────────────────

message ListSchemasRequest {
  string     project = 1;
  string     repo    = 2;
  VersionRef at      = 3;  // defaults to HEAD of default branch
}

message ListSchemasResponse {
  repeated SchemaInfo schemas = 1;
  // Exact immutable repository snapshot used for the listing.
  string at_commit = 2;
}

// ── ListDeclarations ──────────────────────────────────────────────────────────

message ListDeclarationsRequest {
  string     project     = 1;
  string     repo        = 2;
  string     schema_path = 3;  // e.g. "user.proto"
  VersionRef at          = 4;
  // Optional: filter by kind.
  DeclKind   kind_filter = 5;
}

message ListDeclarationsResponse {
  repeated DeclSummary declarations = 1;
  // Exact immutable repository snapshot used for every summary.
  string at_commit = 2;
}

// ── GetDeclaration ────────────────────────────────────────────────────────────

message GetDeclarationRequest {
  string     project          = 1;
  string     repo             = 2;
  string     schema_path      = 3;
  string     declaration_name = 4;  // e.g. "UserRequest", "path:/users"
  VersionRef at               = 5;
}

message GetDeclarationResponse {
  DeclSummary summary    = 1;
  // Full detail as format-specific bytes. The client-side plugin library
  // deserializes this for display. The CLI renders it as human-readable text.
  bytes       detail     = 2;
  // The commit hash that was actually resolved (useful when `at` was a branch name).
  string      at_commit  = 3;
}

// ── GetSchemaSource ───────────────────────────────────────────────────────────

message GetSchemaSourceRequest {
  string     project     = 1;
  string     repo        = 2;
  string     schema_path = 3;  // e.g. "user.proto"
  VersionRef at          = 4;  // defaults to HEAD of default branch
}

message GetSchemaSourceResponse {
  // Canonical reconstructed UTF-8 source. Raw uploaded text is not stored.
  bytes  source     = 1;
  // The commit hash that was actually resolved.
  string at_commit  = 2;
}

// ── FollowType ────────────────────────────────────────────────────────────────

message FollowTypeRequest {
  string     project          = 1;
  string     repo             = 2;
  string     schema_path      = 3;
  string     declaration_name = 4;  // the declaration containing the field
  string     field_name       = 5;  // the field whose type to follow
  VersionRef at               = 6;
}

message FollowTypeResponse {
  // The schema and declaration where the field's type is defined.
  // May be in a different project/repo (cross-repo import).
  string resolved_project     = 1;
  string resolved_repo        = 2;
  string resolved_schema_path = 3;
  string resolved_commit      = 4;  // the pinned import commit that was followed
  DeclSummary summary         = 5;
  bytes       detail          = 6;
  // Exact immutable snapshot of the declaration containing the field.
  string      source_commit   = 7;
  // True when resolution followed a stored immutable import pin. False for a
  // local declaration or live import resolved at request time.
  bool        pinned          = 8;
  // Exact logical import path followed; empty for a same-schema declaration.
  string      import_path     = 9;
}

// ── ListDependencies ──────────────────────────────────────────────────────────

message ListDependenciesRequest {
  string     project     = 1;
  string     repo        = 2;
  string     schema_path = 3;
  VersionRef at          = 4;
  // If true, return the transitive closure (all transitive imports).
  // If false (default), return only direct imports.
  bool       transitive  = 5;
}

message ListDependenciesResponse {
  repeated DependencyEntry dependencies = 1;
  // Exact immutable importing-repository snapshot used for the traversal root.
  string at_commit = 2;
}

message DependencyEntry {
  string importing_schema  = 1;
  string importing_decl    = 2;
  string imported_project  = 3;
  string imported_repo     = 4;
  string imported_schema   = 5;
  string imported_decl     = 6;
  string resolved_commit   = 7;  // stored pin; empty for a live import
  bool   pinned            = 8;
  string import_path       = 9;  // exact logical path stored by the compiler
  string importing_project = 10;
  string importing_repo    = 11;
  string importing_commit  = 12; // exact snapshot containing this edge
  string target_commit     = 13; // exact target snapshot when resolved
  // False when a referenced external/builtin schema is absent, archived, or
  // unreadable to the caller. Such an edge is returned but not traversed.
  bool   resolved          = 14;
}

// ── ListDependents ────────────────────────────────────────────────────────────

message ListDependentsRequest {
  string project     = 1;
  string repo        = 2;
  string schema_path = 3;
}

message ListDependentsResponse {
  // Direct import edges only. Callers coordinate downstream changes
  // explicitly; SchemaHub does not rewrite another repository.
  repeated DependentEntry dependents = 1;
  // One immutable snapshot per visible, non-empty repository inspected. There
  // is no atomic global snapshot across repositories.
  repeated DependencyScanSnapshot snapshots = 2;
  uint32 schemas_scanned = 3;
}

message DependentEntry {
  string importing_project  = 1;
  string importing_repo     = 2;
  string importing_schema   = 3;
  string importing_decl     = 4;  // empty when the format records imports at file level
  string importing_bookmark = 5;
  string importing_commit   = 6;
  string import_path        = 7;  // exact logical path stored by the compiler
  string imported_decl      = 8;
  string resolved_commit    = 9;  // empty for a live/unpinned import
  bool   pinned             = 10;
}

message DependencyScanSnapshot {
  string project   = 1;
  string repo      = 2;
  string bookmark  = 3;
  string commit_id = 4;
}

// ── Search ────────────────────────────────────────────────────────────────────

message SearchRequest {
  string   query   = 1;  // declaration name prefix to search for
  // Required repository scope.
  string   project = 2;
  string   repo    = 3;
  DeclKind kind    = 4;  // filter by kind; UNSPECIFIED = all kinds
  uint32   limit   = 5;  // max results; default 50, max 200
  // Ref to search at — branch / tag / commit. Defaults to the repo's default
  // bookmark (cross-ref search; was previously hard-coded to `main`).
  VersionRef at    = 6;
}

message SearchResponse {
  repeated SearchResult results = 1;
  // Exact immutable repository snapshot searched.
  string at_commit = 2;
}

message SearchResult {
  string      project     = 1;
  string      repo        = 2;
  string      schema_path = 3;
  DeclSummary declaration = 4;
}
