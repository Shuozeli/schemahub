syntax = "proto3";
package schemahub.v1;

option go_package = "github.com/shuozeli/schemahub/gen/go/schemahub/v1";

import "schemahub/v1/enums.proto";
import "schemahub/v1/mutations.proto";

service SchemaService {
  // ── Schema lifecycle ────────────────────────────────────────────────────────
  // Create a new schema file on a branch.
  // Returns ALREADY_EXISTS if the schema name exists on the branch.
  rpc CreateSchema(CreateSchemaRequest) returns (CreateSchemaResponse);

  // Update an existing schema with a whole-document push. Granular mutation
  // coverage is format-specific and advertised separately.
  // Returns NOT_FOUND if the schema does not exist.
  // Runs compatibility check if the branch is protected.
  rpc UpdateSchema(UpdateSchemaRequest) returns (UpdateSchemaResponse);

  // Delete a schema from a branch. Rejected while another schema on the same
  // branch has a live unpinned import. Force bypasses compatibility policy, not
  // reference integrity.
  rpc DeleteSchema(DeleteSchemaRequest) returns (DeleteSchemaResponse);

  // ── Mutations ───────────────────────────────────────────────────────────────
  // Apply a single granular mutation to one declaration.
  rpc ApplyMutation(ApplyMutationRequest) returns (ApplyMutationResponse);

  // Apply a sequence of mutations across one or more schemas atomically.
  // All schemas in one transaction must use the same format.
  // Limits: <= 100 operations and <= 20 schemas. The server enforces the
  // 30-second execution deadline advertised by GetServerConfig; clients may
  // still choose a shorter RPC deadline.
  rpc ApplyTransaction(ApplyTransactionRequest) returns (ApplyTransactionResponse);
}

// ── CreateSchema ──────────────────────────────────────────────────────────────

message CreateSchemaRequest {
  string       project     = 1;
  string       repo        = 2;
  string       branch      = 3;
  string       schema_name = 4;  // e.g. "user.proto"
  SchemaFormat format      = 5;  // required; server does not infer from content
  string       source      = 6;  // full source text
  string       base_revision    = 7;  // retained causal commit; stale is allowed, foreign/unknown is rejected
  string       idempotency_key  = 8;
}

message CreateSchemaResponse {
  string new_commit = 1;  // hash of the commit created
  string change_id  = 2;  // stable jj change-id (durable identity, design.md §5.1)
  // Conflicts published on an unprotected bookmark. Successful protected
  // writes are always clean because final-tree conflicts are rejected.
  repeated string conflicted_decls = 3;
}

// ── UpdateSchema ──────────────────────────────────────────────────────────────

message UpdateSchemaRequest {
  string project         = 1;
  string repo            = 2;
  string branch          = 3;
  string schema_name     = 4;
  string source          = 5;  // full source text of the new version
  string base_revision   = 6;  // advisory retained causal commit, not a branch-head CAS
  string idempotency_key = 7;
  bool   force           = 8;  // skip compatibility check; requires Maintainer role
}

message UpdateSchemaResponse {
  string new_commit = 1;
  string change_id  = 2;
  // Conflicts published on an unprotected bookmark; protected writes reject.
  repeated string conflicted_decls = 3;
}

// ── DeleteSchema ──────────────────────────────────────────────────────────────

message DeleteSchemaRequest {
  string project         = 1;
  string repo            = 2;
  string branch          = 3;
  string schema_name     = 4;
  string base_revision   = 5;  // advisory retained causal commit, not a branch-head CAS
  string idempotency_key = 6;
  bool   force           = 7;  // skip protected-branch compatibility; requires Maintainer
}

message DeleteSchemaResponse {
  string new_commit = 1;
  string change_id  = 2;
  // Conflicts published on an unprotected bookmark; protected writes reject.
  repeated string conflicted_decls = 3;
}

// ── ApplyMutation ─────────────────────────────────────────────────────────────

message ApplyMutationRequest {
  string project         = 1;
  string repo            = 2;
  string branch          = 3;
  string base_revision   = 4;  // advisory retained causal commit, not a branch-head CAS
  string idempotency_key = 5;
  bool   force           = 6;
  oneof operation {
    ProtobufMutation    protobuf_op = 7;
    FlatBuffersMutation fbs_op      = 8;
    OpenApiMutation     openapi_op  = 9;
  }
}

message ApplyMutationResponse {
  string new_commit = 1;
  string change_id  = 2;
  // Conflicts published on an unprotected bookmark; protected writes reject.
  repeated string conflicted_decls = 3;
}

// ── ApplyTransaction ──────────────────────────────────────────────────────────

message ApplyTransactionRequest {
  string project         = 1;
  string repo            = 2;
  string branch          = 3;
  string base_revision   = 4;  // advisory retained causal commit, not a branch-head CAS
  string idempotency_key = 5;
  bool   force           = 6;
  // All operations must target the same format.
  // Mixed-format transactions are rejected with INVALID_ARGUMENT.
  repeated TransactionOp operations = 7;
}

// One operation within a transaction. The oneof mirrors ApplyMutationRequest
// but without the top-level fields (project, repo, branch) which are shared.
message TransactionOp {
  oneof operation {
    ProtobufMutation    protobuf_op = 1;
    FlatBuffersMutation fbs_op      = 2;
    OpenApiMutation     openapi_op  = 3;
  }
}

message ApplyTransactionResponse {
  string new_commit = 1;
  string change_id  = 2;
  // Conflicts published on an unprotected bookmark; protected writes reject.
  repeated string conflicted_decls = 3;
}
