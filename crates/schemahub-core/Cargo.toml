[package]
name    = "schemahub-core"
version = "0.1.0"
edition = "2021"

[dependencies]
schemahub-types = { path = "../schemahub-types" }
schemahub-jj   = { path = "../schemahub-jj" }
thiserror       = { workspace = true }
# `bytes` appears in the public API (generate_descriptors → Bytes), mirroring
# the Compiler trait's signature in schemahub-types.
bytes           = { workspace = true }
# File-backed RoleStore + ProjectStore persist as JSON; serde is also used by
# the in-memory ProjectMeta type (declared in `auth_store`).
serde           = { workspace = true }
serde_json      = { workspace = true }
uuid            = { workspace = true }
sha2            = { workspace = true }
hex             = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
# Used ONLY by tests to parse real schemas and build real op envelopes so the
# format-agnostic mutation/exploration/codegen flows can be exercised end to
# end. These are never normal dependencies.
schemahub-compiler-protobuf = { path = "../schemahub-compiler-protobuf" }
schemahub-compiler-openapi = { path = "../schemahub-compiler-openapi" }
tempfile = { workspace = true }
