[package]
name    = "schemahub-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "schemahub-server"
path = "src/main.rs"

[dependencies]
schemahub-types                = { path = "../schemahub-types" }
schemahub-jj                  = { path = "../schemahub-jj" }
schemahub-core                 = { path = "../schemahub-core" }
schemahub-api                  = { path = "../schemahub-api" }
schemahub-compiler-protobuf    = { path = "../schemahub-compiler-protobuf" }
schemahub-compiler-flatbuffers = { path = "../schemahub-compiler-flatbuffers" }
schemahub-compiler-openapi     = { path = "../schemahub-compiler-openapi" }
tokio    = { workspace = true }
tonic    = { workspace = true }
anyhow   = { workspace = true }
prost    = { workspace = true }
prost-types = { workspace = true }
bytes    = { workspace = true }
serde    = { workspace = true }
toml     = { workspace = true }
clap     = { workspace = true }
tokio-stream = "0.1"

[features]
default = []
# Enable the Postgres-backed ObjectDb. Pulls the `postgres` feature on
# schemahub-jj (which is the actual compile gate for `PgObjectDb`).
postgres = ["schemahub-jj/postgres"]

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
