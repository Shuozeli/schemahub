[package]
name    = "schemahub-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "schemahub"
path = "src/main.rs"

[dependencies]
schemahub-api = { path = "../schemahub-api" }
tokio    = { workspace = true }
tonic    = { workspace = true }
prost    = { workspace = true }
prost-types = { workspace = true }
clap     = { workspace = true }
anyhow   = { workspace = true }
serde    = { workspace = true }
serde_json = { workspace = true }
toml     = { workspace = true }
bytes    = { workspace = true }
uuid     = { workspace = true }
sha2     = { workspace = true }
hex      = { workspace = true }

[dev-dependencies]
schemahub-jj = { path = "../schemahub-jj" }
schemahub-server = { path = "../schemahub-server" }
schemahub-types = { path = "../schemahub-types" }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
