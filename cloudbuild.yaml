# Supplemental Cloud Build checks for SchemaHub. The complete canonical matrix
# (PostgreSQL, GUI, container, and release artifacts) is in GitHub Actions.
#
# Both sibling compiler boundaries resolve from immutable Cargo Git revisions,
# so the submitted SchemaHub checkout is sufficient for every build step.
---
substitutions:
  _RUST_IMAGE: rust:1.95.0-bookworm

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: validate-immutable-compiler-dependencies
    name: ${_RUST_IMAGE}
    entrypoint: bash
    args:
      - -ceu
      - |
        set -o pipefail
        protobuf_revision="$(
          scripts/validate-compiler-lock.sh protobuf --development
        )"
        flatbuffers_revision="$(
          scripts/validate-compiler-lock.sh flatbuffers --development
        )"
        scripts/validate-compiler-lock.sh protobuf "$protobuf_revision"
        scripts/validate-compiler-lock.sh flatbuffers "$flatbuffers_revision"
        cargo metadata --locked --format-version=1 >/dev/null

  - id: cargo-fmt
    name: ${_RUST_IMAGE}
    entrypoint: bash
    args:
      - -ceu
      - |
        rustup component add rustfmt
        cargo fmt --all -- --check

  - id: cargo-clippy
    name: ${_RUST_IMAGE}
    entrypoint: bash
    args:
      - -ceu
      - |
        rustup component add clippy
        CARGO_INCREMENTAL=0 cargo clippy \
          --release --workspace --all-targets --all-features --locked -- -D warnings

  - id: cargo-test-workspace
    name: ${_RUST_IMAGE}
    entrypoint: bash
    args:
      - -ceu
      - CARGO_INCREMENTAL=0 cargo test --release --workspace --locked

  - id: cargo-check-server-postgres
    name: ${_RUST_IMAGE}
    entrypoint: bash
    args:
      - -ceu
      - CARGO_INCREMENTAL=0 cargo check --release -p schemahub-server --features postgres --locked
