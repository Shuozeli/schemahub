syntax = "proto3";

package inventory.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message Money {
  string currency_code = 1;
  int64 units = 2;
  int32 nanos = 3;
}

message Warehouse {
  message Address {
    string line1 = 1;
    string city = 2;
    string region = 3;
    string postal_code = 4;
  }

  string id = 1;
  string display_name = 2;
  Address address = 3;
  repeated string fulfillment_zones = 4;
  map<string, string> labels = 5;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

message Product {
  reserved 8, 12 to 15;
  reserved "legacy_sku";

  message Dimensions {
    double length_cm = 1;
    double width_cm = 2;
    double height_cm = 3;
  }

  string id = 1;
  string sku = 2;
  ProductStatus status = 3;
  Money price = 4;
  Dimensions dimensions = 5;
  repeated string tags = 6;
  map<string, string> attributes = 7;
  optional string gtin = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Duration shelf_life = 11;

  oneof purchasable_unit {
    string each_unit = 16;
    string case_pack = 17;
  }
}

message InventoryEvent {
  string event_id = 1;
  Product product = 2;
  Warehouse warehouse = 3;
  int32 quantity_delta = 4;
  google.protobuf.Timestamp observed_at = 5;
}

service InventoryService {
  rpc GetProduct(Product) returns (Product);
  rpc WatchInventory(Warehouse) returns (stream InventoryEvent);
}
